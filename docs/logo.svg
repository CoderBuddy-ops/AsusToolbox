<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f36;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bc8cff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb950;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="232" r="140" fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.3"/>
  <circle cx="256" cy="232" r="120" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.15"/>

  <!-- Fan blades -->
  <g transform="translate(256,232)" opacity="0.9">
    <path d="M0,-100 Q40,-80 30,-30 L0,-10 Z" fill="url(#accent)" opacity="0.8"/>
    <path d="M0,-100 Q40,-80 30,-30 L0,-10 Z" fill="url(#accent)" opacity="0.8" transform="rotate(60)"/>
    <path d="M0,-100 Q40,-80 30,-30 L0,-10 Z" fill="url(#accent)" opacity="0.8" transform="rotate(120)"/>
    <path d="M0,-100 Q40,-80 30,-30 L0,-10 Z" fill="url(#accent)" opacity="0.8" transform="rotate(180)"/>
    <path d="M0,-100 Q40,-80 30,-30 L0,-10 Z" fill="url(#accent)" opacity="0.8" transform="rotate(240)"/>
    <path d="M0,-100 Q40,-80 30,-30 L0,-10 Z" fill="url(#accent)" opacity="0.8" transform="rotate(300)"/>
  </g>

  <!-- Center hub -->
  <circle cx="256" cy="232" r="28" fill="url(#accent)"/>
  <circle cx="256" cy="232" r="12" fill="#0d1117"/>

  <!-- Gauge arc (bottom right) -->
  <path d="M340,280 A90,90 0 0,1 310,340" fill="none" stroke="url(#green)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Gauge needle -->
  <line x1="256" y1="232" x2="320" y2="300" stroke="url(#green)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Lightning bolt (performance) -->
  <path d="M280,160 L260,200 L275,200 L255,240 L295,195 L278,195 L298,160 Z" fill="#f0c040" opacity="0.6"/>

  <!-- Text: AT -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="72" fill="url(#accent)" letter-spacing="8">AT</text>

  <!-- Text: AsusToolbox -->
  <text x="256" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="28" fill="#8b949e" letter-spacing="4">AsusToolbox</text>
</svg>
