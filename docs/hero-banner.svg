<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bc8cff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb950;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#58a6ff" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Fan icon (left) -->
  <g transform="translate(200,320)" opacity="0.15">
    <circle r="180" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <circle r="140" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <path d="M0,-150 Q60,-120 45,-45 L0,-15 Z" fill="url(#accent)" opacity="0.5"/>
    <path d="M0,-150 Q60,-120 45,-45 L0,-15 Z" fill="url(#accent)" opacity="0.5" transform="rotate(60)"/>
    <path d="M0,-150 Q60,-120 45,-45 L0,-15 Z" fill="url(#accent)" opacity="0.5" transform="rotate(120)"/>
    <path d="M0,-150 Q60,-120 45,-45 L0,-15 Z" fill="url(#accent)" opacity="0.5" transform="rotate(180)"/>
    <path d="M0,-150 Q60,-120 45,-45 L0,-15 Z" fill="url(#accent)" opacity="0.5" transform="rotate(240)"/>
    <path d="M0,-150 Q60,-120 45,-45 L0,-15 Z" fill="url(#accent)" opacity="0.5" transform="rotate(300)"/>
    <circle r="40" fill="url(#accent)" opacity="0.3"/>
    <circle r="15" fill="#0d1117"/>
  </g>

  <!-- Main title -->
  <text x="640" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="72" fill="url(#accent)" filter="url(#glow)">AsusToolbox</text>

  <!-- Subtitle -->
  <text x="640" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="300" font-size="28" fill="#8b949e">Ultralight Control for ASUS Laptops</text>

  <!-- Stats bar -->
  <g transform="translate(640,400)">
    <!-- Stat 1 -->
    <g transform="translate(-300,0)">
      <text x="0" y="0" text-anchor="middle" font-family="Arial" font-weight="800" font-size="36" fill="url(#accent)">4.3 MB</text>
      <text x="0" y="28" text-anchor="middle" font-family="Arial" font-weight="400" font-size="14" fill="#8b949e">Executable Size</text>
    </g>
    <!-- Divider -->
    <line x1="-160" y1="-20" x2="-160" y2="20" stroke="#30363d" stroke-width="1"/>
    <!-- Stat 2 -->
    <g transform="translate(-60,0)">
      <text x="0" y="0" text-anchor="middle" font-family="Arial" font-weight="800" font-size="36" fill="url(#green)">87 MB</text>
      <text x="0" y="28" text-anchor="middle" font-family="Arial" font-weight="400" font-size="14" fill="#8b949e">RAM at Idle</text>
    </g>
    <!-- Divider -->
    <line x1="80" y1="-20" x2="80" y2="20" stroke="#30363d" stroke-width="1"/>
    <!-- Stat 3 -->
    <g transform="translate(200,0)">
      <text x="0" y="0" text-anchor="middle" font-family="Arial" font-weight="800" font-size="36" fill="#d29922">0</text>
      <text x="0" y="28" text-anchor="middle" font-family="Arial" font-weight="400" font-size="14" fill="#8b949e">Bloat Packages</text>
    </g>
    <!-- Divider -->
    <line x1="320" y1="-20" x2="320" y2="20" stroke="#30363d" stroke-width="1"/>
    <!-- Stat 4 -->
    <g transform="translate(420,0)">
      <text x="0" y="0" text-anchor="middle" font-family="Arial" font-weight="800" font-size="36" fill="#f85149">28</text>
      <text x="0" y="28" text-anchor="middle" font-family="Arial" font-weight="400" font-size="14" fill="#8b949e">Threads</text>
    </g>
  </g>

  <!-- Feature badges -->
  <g transform="translate(640,500)">
    <rect x="-340" y="-18" width="130" height="36" rx="18" fill="#1c2333" stroke="#30363d" stroke-width="1"/>
    <text x="-275" y="6" text-anchor="middle" font-family="Arial" font-weight="600" font-size="14" fill="#3fb950">🌀 Fans</text>

    <rect x="-190" y="-18" width="140" height="36" rx="18" fill="#1c2333" stroke="#30363d" stroke-width="1"/>
    <text x="-120" y="6" text-anchor="middle" font-family="Arial" font-weight="600" font-size="14" fill="#bc8cff">⚡ Modes</text>

    <rect x="-30" y="-18" width="140" height="36" rx="18" fill="#1c2333" stroke="#30363d" stroke-width="1"/>
    <text x="40" y="6" text-anchor="middle" font-family="Arial" font-weight="600" font-size="14" fill="#d29922">🔋 Battery</text>

    <rect x="130" y="-18" width="180" height="36" rx="18" fill="#1c2333" stroke="#30363d" stroke-width="1"/>
    <text x="220" y="6" text-anchor="middle" font-family="Arial" font-weight="600" font-size="14" fill="#f85149">🎨 Backlight</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="636" width="1280" height="4" fill="url(#accent)" opacity="0.6"/>
</svg>
